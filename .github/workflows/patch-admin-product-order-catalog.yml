name: Patch admin product order catalog

on:
  push:
    branches:
      - feat/admin-product-order-catalog

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: admin product forms use live catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin product and order forms
        shell: python
        run: |
          from pathlib import Path

          settings = Path('apps/web/src/app/(dashboard)/settings/products/page.tsx')
          text = settings.read_text()
          # Settings form is already patched separately; this guard prevents accidental regression.
          assert 'tags: string' in text
          assert 'isFeatured: boolean' in text
          assert 'Featured product' in text
          assert 'New product' in text

          manual = Path('apps/web/src/components/orders/manual-order-form.tsx')
          text = manual.read_text()
          text = text.replace('import { MENU_ITEMS } from "@/lib/menu";\n', '')
          old = '''const productOptions = MENU_ITEMS.map((item) => ({\n  label: `${item.label} - Php ${item.price}`,\n  value: item.value,\n  price: item.price\n}));\n'''
          new = '''type ProductCatalogItem = {\n  name: string;\n  price: number;\n  available: boolean;\n  sortOrder?: number;\n};\n\ntype ProductOption = {\n  label: string;\n  value: string;\n  price: number;\n  available: boolean;\n};\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  const [lineItems, setLineItems] = useState<OrderLineItem[]>(createInitialLineItems);\n  const [customers, setCustomers] = useState<CustomerSuggestion[]>([]);\n'''
          new = '''  const [lineItems, setLineItems] = useState<OrderLineItem[]>([]);\n  const [catalogProducts, setCatalogProducts] = useState<ProductCatalogItem[]>([]);\n  const [customers, setCustomers] = useState<CustomerSuggestion[]>([]);\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  useEffect(() => {\n    setForm((current) => (current.preferredSchedule ? current : { ...current, preferredSchedule: getLocalDateTimeInputValue() }));\n  }, []);\n\n  useEffect(() => {\n    if (!open || customersLoaded) {\n'''
          new = '''  const productOptions = useMemo<ProductOption[]>(() => catalogProducts\n    .slice()\n    .sort((a, b) => Number(a.sortOrder ?? 0) - Number(b.sortOrder ?? 0) || a.name.localeCompare(b.name))\n    .map((product) => ({\n      label: `${product.name} - Php ${Number(product.price)}${product.available ? "" : " — SOLD OUT"}`,\n      value: product.name,\n      price: Number(product.price),\n      available: product.available !== false\n    })), [catalogProducts]);\n\n  useEffect(() => {\n    setForm((current) => (current.preferredSchedule ? current : { ...current, preferredSchedule: getLocalDateTimeInputValue() }));\n  }, []);\n\n  useEffect(() => {\n    if (!open) {\n      return;\n    }\n\n    let active = true;\n    void apiFetch<ProductCatalogItem[]>("/products")\n      .then((result) => {\n        if (!active) return;\n        const products = Array.isArray(result) ? result : [];\n        setCatalogProducts(products);\n        setLineItems(products\n          .slice()\n          .sort((a, b) => Number(a.sortOrder ?? 0) - Number(b.sortOrder ?? 0) || a.name.localeCompare(b.name))\n          .map((product, index) => ({ productName: product.name, quantity: index === 0 ? "20" : "" })));\n      })\n      .catch(() => {\n        if (active) setCatalogProducts([]);\n      });\n\n    return () => {\n      active = false;\n    };\n  }, [open]);\n\n  useEffect(() => {\n    if (!open || customersLoaded) {\n'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('''  }, [form.deliveryFee, form.deliveryMethod, lineItems, ownDeliveryQuote]);\n''', '''  }, [form.deliveryFee, form.deliveryMethod, lineItems, ownDeliveryQuote, productOptions]);\n''', 1)
          old = '''        setLineItems(createInitialLineItems());\n        setOpen(false);\n'''
          new = '''        setLineItems(productOptions.map((product, index) => ({ productName: product.value, quantity: index === 0 ? "20" : "" })));\n        setOpen(false);\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''function createInitialLineItems(): OrderLineItem[] {\n  return productOptions.map((product, index) => ({\n    productName: product.value,\n    quantity: index === 0 ? "20" : ""\n  }));\n}\n\n'''
          assert old in text
          text = text.replace(old, '', 1)
          # Disable quantity controls for unavailable products while still showing every catalog flavor.
          text = text.replace('''                        <button\n                          type="button"\n                          aria-label={`Decrease ${item.productName}`}\n''', '''                        <button\n                          type="button"\n                          disabled={!product?.available}\n                          aria-label={`Decrease ${item.productName}`}\n''', 1)
          text = text.replace('''                        <Input\n                          aria-label={`${item.productName} quantity`}\n''', '''                        <Input\n                          disabled={!product?.available}\n                          aria-label={`${item.productName} quantity`}\n''', 1)
          text = text.replace('''                        <button\n                          type="button"\n                          aria-label={`Increase ${item.productName}`}\n''', '''                        <button\n                          type="button"\n                          disabled={!product?.available}\n                          aria-label={`Increase ${item.productName}`}\n''', 1)
          manual.write_text(text)

          board = Path('apps/web/src/components/orders/orders-board.tsx')
          text = board.read_text()
          text = text.replace('import { MENU_ITEMS } from "@/lib/menu";\n', '')
          old = '''const productOptions = MENU_ITEMS.map((item) => ({\n  label: item.label,\n  value: item.value,\n  price: item.price\n}));\n'''
          new = '''type ProductCatalogItem = {\n  name: string;\n  price: number;\n  available: boolean;\n  sortOrder?: number;\n};\n\ntype ProductOption = {\n  label: string;\n  value: string;\n  price: number;\n  available: boolean;\n};\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  const [lineItems, setLineItems] = useState<EditableOrderLineItem[]>(() => createEditableLineItems());\n\n  const refreshOrders'''
          new = '''  const [lineItems, setLineItems] = useState<EditableOrderLineItem[]>([]);\n  const [catalogProducts, setCatalogProducts] = useState<ProductCatalogItem[]>([]);\n  const productOptions = useMemo<ProductOption[]>(() => catalogProducts\n    .slice()\n    .sort((a, b) => Number(a.sortOrder ?? 0) - Number(b.sortOrder ?? 0) || a.name.localeCompare(b.name))\n    .map((product) => ({\n      label: `${product.name} - Php ${Number(product.price)}${product.available ? "" : " — SOLD OUT"}`,\n      value: product.name,\n      price: Number(product.price),\n      available: product.available !== false\n    })), [catalogProducts]);\n\n  useEffect(() => {\n    let active = true;\n    void apiFetch<ProductCatalogItem[]>("/products")\n      .then((result) => {\n        if (active) setCatalogProducts(Array.isArray(result) ? result : []);\n      })\n      .catch(() => {\n        if (active) setCatalogProducts([]);\n      });\n    return () => {\n      active = false;\n    };\n  }, []);\n\n  const refreshOrders'''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('setLineItems(createEditableLineItems(selectedOrder));', 'setLineItems(createEditableLineItems(selectedOrder, productOptions));', 1)
          old = '''      return createEditableLineItems(selectedOrder);\n    });\n  }, [editMode, selectedOrder?.id, selectedOrder?.status]);\n'''
          new = '''      return createEditableLineItems(selectedOrder, productOptions);\n    });\n  }, [editMode, selectedOrder?.id, selectedOrder?.status, productOptions]);\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''function createEditableLineItems(order?: any): EditableOrderLineItem[] {\n  const parsedItems = order ? getOrderLineItems(order) : [];\n  const parsedByName = new Map(parsedItems.map((item) => [item.name.toLowerCase(), item]));\n  const knownItems = productOptions.map((product) => {\n'''
          new = '''function createEditableLineItems(order: any | undefined, productOptions: ProductOption[]): EditableOrderLineItem[] {\n  const parsedItems = order ? getOrderLineItems(order) : [];\n  const parsedByName = new Map(parsedItems.map((item) => [item.name.toLowerCase(), item]));\n  const knownItems = productOptions.map((product) => {\n'''
          assert old in text
          text = text.replace(old, new, 1)
          # Prevent selecting unavailable catalog entries for quantities but keep them visible.
          text = text.replace('''                                      <button\n                                        type="button"\n                                        aria-label={`Decrease ${item.productName}`}\n''', '''                                      <button\n                                        type="button"\n                                        disabled={!productOptions.find((product) => product.value === item.productName)?.available}\n                                        aria-label={`Decrease ${item.productName}`}\n''', 1)
          text = text.replace('''                                      <Input\n                                        aria-label={`${item.productName} quantity`}\n''', '''                                      <Input\n                                        disabled={!productOptions.find((product) => product.value === item.productName)?.available}\n                                        aria-label={`${item.productName} quantity`}\n''', 1)
          text = text.replace('''                                      <button\n                                        type="button"\n                                        aria-label={`Increase ${item.productName}`}\n''', '''                                      <button\n                                        type="button"\n                                        disabled={!productOptions.find((product) => product.value === item.productName)?.available}\n                                        aria-label={`Increase ${item.productName}`}\n''', 1)
          board.write_text(text)

      - name: Verify patched files
        run: |
          grep -n 'apiFetch<ProductCatalogItem[]>("/products")' apps/web/src/components/orders/manual-order-form.tsx
          grep -n 'apiFetch<ProductCatalogItem[]>("/products")' apps/web/src/components/orders/orders-board.tsx
          grep -n 'tags: string' 'apps/web/src/app/(dashboard)/settings/products/page.tsx'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/(dashboard)/settings/products/page.tsx apps/web/src/components/orders/manual-order-form.tsx apps/web/src/components/orders/orders-board.tsx .github/workflows/patch-admin-product-order-catalog.yml
          git commit -m "fix: admin product forms use live catalog"
          git push
