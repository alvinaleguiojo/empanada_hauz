name: Fix order status TTS semantics

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: status update TTS payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch status realtime payload
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/api/src/modules/orders/orders.service.ts')
          text = path.read_text()

          start = text.index('  async updateStatus(id: string, status: OrderStatus) {')
          end = text.index('  async update(id: string, dto: UpdateOrderDto) {', start)
          section = text[start:end]

          old = '    this.realtime.emit("orders.updated", order);'
          new = '    this.realtime.emit("orders.updated", {\n      id: order.id,\n      orderNumber: order.orderNumber,\n      customerName: order.customer?.name,\n      status: order.status,\n      updatedAt: order.updatedAt\n    });'

          if section.count(old) != 1:
              raise SystemExit('Expected updateStatus realtime emit was not found exactly once')

          section = section.replace(old, new, 1)
          text = text[:start] + section + text[end:]
          path.write_text(text)

      - name: Verify
        run: |
          grep -n -A12 'async updateStatus' apps/api/src/modules/orders/orders.service.ts | head -20

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/orders/orders.service.ts
          git rm .github/workflows/fix-order-status-tts.yml
          git commit -m "fix: status update TTS payload"
          git push
