name: Repair order editor state

on:
  push:
    paths:
      - .github/workflows/repair-order-editor.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch order editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/components/orders/orders-board.tsx")
          text = path.read_text()
          old = '''    setLineItems((current) => {
      const hasAllCatalogProducts =
        productOptions.every((product) =>
          current.some(
            (item) =>
              item.productName.toLowerCase() ===
              product.value.toLowerCase(),
          ),
        );

      return hasAllCatalogProducts
        ? current
        : createEditableLineItems(
            selectedOrder,
            productOptions,
          );
    });'''
          new = '''    setLineItems((current) => {
      if (current.length > 0) {
        return current;
      }

      return createEditableLineItems(
        selectedOrder,
        productOptions,
      );
    });'''
          if old not in text:
              raise SystemExit("target state-overwrite block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-order-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/orders/orders-board.tsx .github/workflows/repair-order-editor.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve order edit line items when catalog loads"
          git push origin HEAD:main
