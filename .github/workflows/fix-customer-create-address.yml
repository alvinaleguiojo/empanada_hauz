name: Patch public customer catalog badges
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: show public product badges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public customer catalog
        shell: python
        run: |
          from pathlib import Path
          import re

          client = Path('apps/web/src/app/customer/page-client.tsx')
          text = client.read_text()
          helper = '''\nfunction ProductBadges({ item }: { item: (typeof MENU_ITEMS)[number] }) {\n  const tags = Array.isArray(item.tags) ? item.tags.filter(Boolean) : [];\n  if (!item.isFeatured && !item.isNew && tags.length === 0) return null;\n  const formatTag = (tag: string) => tag.replace(/[-_]+/g, " ").trim().replace(/\\b\\w/g, (char) => char.toUpperCase());\n  return (\n    <span className="ml-2 inline-flex flex-wrap items-center gap-1 align-middle">\n      {item.isFeatured ? <span className="rounded-full border border-[#E3A64B]/45 bg-[#E3A64B]/12 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-[#E3A64B]">Featured</span> : null}\n      {item.isNew ? <span className="rounded-full border border-[#7A9B4E]/45 bg-[#7A9B4E]/12 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-[#c9dba6]">New</span> : null}\n      {tags.map((tag) => <span key={`${item.value}-${tag}`} className="rounded-full border border-[#F2E8D5]/20 bg-[#F2E8D5]/8 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-[#F2E8D5]/75">{formatTag(tag)}</span>)}\n    </span>\n  );\n}\n'''
          if 'function ProductBadges(' not in text:
              marker = 'export default function CustomerKioskPage() {'
              if marker not in text: raise SystemExit('CustomerKioskPage marker not found')
              text = text.replace(marker, helper + '\n' + marker, 1)
          match = re.search(r'flavorOptions\.map\(\((?P<var>[A-Za-z_$][\w$]*)\)\s*=>', text)
          if not match: raise SystemExit('Flavor map not found')
          var = match.group('var'); start = match.start()
          label = re.search(r'\{' + re.escape(var) + r'\.(?:label|value)\}', text[start:])
          if not label: raise SystemExit('Flavor label/value render not found')
          gs = start + label.start(); ge = start + label.end(); expr = text[gs:ge]
          text = text[:gs] + expr + f'<ProductBadges item={{{var}}} />' + text[ge:]
          client.write_text(text)

          page = Path('apps/web/src/app/customer/page.tsx')
          page_text = page.read_text()
          page_text = page_text.replace('''  available: boolean;\n  sortOrder?: number;\n''', '''  available: boolean;\n  tags?: string[];\n  isFeatured?: boolean;\n  isNew?: boolean;\n  sortOrder?: number;\n''', 1)
          page.write_text(page_text)
      - name: Verify and commit
        run: |
          grep -n "function ProductBadges" apps/web/src/app/customer/page-client.tsx
          grep -n "ProductBadges item" apps/web/src/app/customer/page-client.tsx
          grep -n "tags?: string\[\]" apps/web/src/app/customer/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/customer/page-client.tsx apps/web/src/app/customer/page.tsx
          git rm .github/workflows/fix-customer-create-address.yml
          git commit -m "fix: show public product badges"
          git push
