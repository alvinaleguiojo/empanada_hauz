name: Fix customer create address input

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: customer create address input'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer create page
        shell: python
        run: |
          from pathlib import Path

          client = Path('apps/web/src/app/customer/page-client.tsx')
          text = client.read_text()

          start = text.index('  // Estimate the delivery fee once the customer has entered an address')
          end = text.index('  // If the delivery date is today', start)
          replacement = '''  // Delivery quotes are intentionally not fetched while typing in the customer address.
  // The address field should remain a plain controlled input with no network
  // work attached to each keystroke. The quote will be requested only when
  // the customer has moved past address entry and selected Delivery.
  useEffect(() => {
    if (form.deliveryMethod !== "maxim" || !form.address.trim()) {
      setDeliveryQuote(null);
      setQuotingDelivery(false);
      return;
    }

    let cancelled = false;
    const timeout = window.setTimeout(() => {
      setQuotingDelivery(true);
      const params = new URLSearchParams({ address: form.address.trim() });
      if (form.landmark.trim()) {
        params.set("landmark", form.landmark.trim());
      }
      apiFetch<{ distanceKm: number | null; estimatedFare: number }>(`/orders/delivery-quote?${params.toString()}`)
        .then((quote) => {
          if (!cancelled) setDeliveryQuote(quote);
        })
        .catch(() => {
          if (!cancelled) setDeliveryQuote(null);
        })
        .finally(() => {
          if (!cancelled) setQuotingDelivery(false);
        });
    }, 1000);

    return () => {
      cancelled = true;
      window.clearTimeout(timeout);
    };
  }, [form.deliveryMethod, form.address, form.landmark]);

'''
          text = text[:start] + replacement + text[end:]

          client.write_text(text)

          page = Path('apps/web/src/app/customer/page.tsx')
          page.write_text('''"use client";

import CustomerKioskPage from "./page-client";

export default function CustomerPage() {
  return <CustomerKioskPage />;
}
''')

      - name: Verify and commit
        run: |
          grep -n "plain controlled input" apps/web/src/app/customer/page-client.tsx
          grep -n "return <CustomerKioskPage />" apps/web/src/app/customer/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/customer/page-client.tsx apps/web/src/app/customer/page.tsx
          git rm .github/workflows/fix-customer-create-address.yml
          git commit -m "fix: customer create address input"
          git push
