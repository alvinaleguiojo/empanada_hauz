name: Remove OrdersBoard polling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-polling:
    if: contains(github.event.head_commit.message, 'chore: remove OrdersBoard 3-second polling') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove 3-second OrdersBoard polling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/orders/orders-board.tsx')
          text = path.read_text()
          block = '''  useEffect(() => {\n    const interval = window.setInterval(() => { if (!editMode) refreshOrders(selectedDateRef.current, searchRef.current).catch((err) => setError(err instanceof Error ? err.message : "Unable to refresh orders")); }, 3_000);\n    return () => window.clearInterval(interval);\n  }, [editMode, refreshOrders]);\n\n'''

          if block not in text:
              raise SystemExit('Expected OrdersBoard 3-second polling block was not found; refusing to modify the file.')

          path.write_text(text.replace(block, '', 1))
          PY

          git diff --check
          if git diff --quiet -- apps/web/src/components/orders/orders-board.tsx; then
            echo 'No OrdersBoard polling change was necessary.'
            exit 1
          fi

      - name: Commit OrdersBoard change and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/orders/orders-board.tsx .github/workflows/remove-orders-board-polling.yml
          git commit -m 'chore: remove OrdersBoard 3-second polling'
          git push origin main
