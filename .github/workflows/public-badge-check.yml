name: Temporary public badge check

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    if: github.event.head_commit.message != 'chore: remove temporary public badge check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public product badges
        run: |
          grep -q "ProductBadges" apps/web/src/app/customer/page-client.tsx
          grep -q "tags?: string\[\]" apps/web/src/app/customer/page.tsx
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/public-badge-check.yml
          git commit -m "chore: remove temporary public badge check"
          git push
