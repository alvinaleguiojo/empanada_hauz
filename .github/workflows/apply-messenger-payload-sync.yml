name: Apply Messenger Payload Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/messenger-payload-sync.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove OrdersBoard 3-second polling
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/components/orders/orders-board.tsx')
          text = path.read_text()
          block = '''  useEffect(() => {\n    const interval = window.setInterval(() => { if (!editMode) refreshOrders(selectedDateRef.current, searchRef.current).catch((err) => setError(err instanceof Error ? err.message : "Unable to refresh orders")); }, 3_000);\n    return () => window.clearInterval(interval);\n  }, [editMode, refreshOrders]);\n\n'''
          if block not in text:
              raise SystemExit('Expected OrdersBoard 3-second polling block was not found; refusing to modify the file.')
          path.write_text(text.replace(block, '', 1))

      - name: Verify polling is gone
        shell: bash
        run: |
          ! grep -n 'setInterval' apps/web/src/components/orders/orders-board.tsx
          git diff --check

      - name: Commit change and remove temporary trigger workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/orders/orders-board.tsx
          git rm -f .github/workflows/apply-messenger-payload-sync.yml .github/messenger-payload-sync.trigger || true
          git commit -m 'chore: remove OrdersBoard 3-second polling'
          git push origin main
