name: Apply Messenger Payload Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/messenger-payload-sync.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Messenger payload changes
        shell: python
        run: |
          from pathlib import Path

          # Backend: send the actual persisted conversation and message records.
          p = Path('apps/api/src/modules/messenger/messenger.service.ts')
          s = p.read_text()
          old = '''    const message = await this.prisma.message.create({ data: { conversationId: conversation.id, metaMessageId: payload.messageId, direction: "inbound", type: payload.type ?? "text", content: payload.text, rawPayload: payload.rawPayload as never } });\n    this.notificationsService.notify("messenger.message_received", { conversationId: conversation.id, senderId: payload.senderId, messageId: payload.messageId, message: payload.text, createdAt: new Date().toISOString() });\n    return message;'''
          new = '''    const message = await this.prisma.message.create({ data: { conversationId: conversation.id, metaMessageId: payload.messageId, direction: "inbound", type: payload.type ?? "text", content: payload.text, rawPayload: payload.rawPayload as never } });\n    const realtimeConversation = await this.prisma.conversation.findUnique({ where: { id: conversation.id }, include: { customer: true } });\n    this.notificationsService.notify("messenger.message_received", {\n      conversationId: conversation.id,\n      senderId: payload.senderId,\n      messageId: message.id,\n      message: message.content,\n      createdAt: message.createdAt.toISOString(),\n      conversation: realtimeConversation,\n      messageRecord: message,\n    });\n    return message;'''
          if old not in s: raise SystemExit('inbound block not found')
          s = s.replace(old, new, 1)

          old = '''      const conversation = await this.getOrCreateConversationByPsid(recipientPsid);\n      const message = await this.prisma.message.create({ data: { conversationId: conversation.id, metaMessageId: metaResult.message_id, direction: "outbound", content: text } });\n      this.notificationsService.notify("messenger.message_sent", { conversationId: conversation.id, recipientPsid, messageId: message.id, metaMessageId: metaResult.message_id, message: text, createdAt: message.createdAt.toISOString() });\n      return metaResult;'''
          new = '''      const conversation = await this.getOrCreateConversationByPsid(recipientPsid, text);\n      const message = await this.prisma.message.create({ data: { conversationId: conversation.id, metaMessageId: metaResult.message_id, direction: "outbound", content: text } });\n      const realtimeConversation = await this.prisma.conversation.findUnique({ where: { id: conversation.id }, include: { customer: true } });\n      this.notificationsService.notify("messenger.message_sent", {\n        conversationId: conversation.id,\n        recipientPsid,\n        messageId: message.id,\n        metaMessageId: metaResult.message_id,\n        message: message.content,\n        createdAt: message.createdAt.toISOString(),\n        conversation: realtimeConversation,\n        messageRecord: message,\n      });\n      return metaResult;'''
          if old not in s: raise SystemExit('outbound block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Inbox: consume the payload directly; no REST request on socket events.
          p = Path('apps/web/src/components/messenger/inbox-list.tsx')
          s = p.read_text()
          marker = 'type CustomerAiState = { globalEnabled: boolean; customerOverride: boolean | null; effectiveEnabled: boolean };'
          if 'type MessengerRealtimePayload' not in s:
              s = s.replace(marker, marker + '''\ntype MessengerRealtimePayload = { conversationId?: string; conversation?: Conversation; messageRecord?: Message };''', 1)
          old = '''  useEffect(() => {\n    const handleNotification = (payload: unknown) => {\n      if (!isMessengerNotification(payload)) return;\n      void loadConversations(true);\n      const conversationId = payload.payload?.conversationId;\n      if (conversationId && conversationId === selectedIdRef.current) {\n        void loadMessages(conversationId, true);\n      }\n    };'''
          new = '''  useEffect(() => {\n    const handleNotification = (event: unknown) => {\n      if (!isMessengerNotification(event)) return;\n      const payload = event.payload as MessengerRealtimePayload;\n      const conversation = payload.conversation;\n      const message = payload.messageRecord;\n      if (conversation) {\n        setConversations((current) => [conversation, ...current.filter((item) => item.id !== conversation.id)]\n          .sort((a, b) => new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime()));\n      }\n      if (message && payload.conversationId === selectedIdRef.current) {\n        setMessages((current) => current.some((item) => item.id === message.id) ? current : [...current, message]);\n      }\n    };'''
          if old not in s: raise SystemExit('inbox handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Floating inbox: same direct state update.
          p = Path('apps/web/src/components/messenger/floating-messenger.tsx')
          s = p.read_text()
          marker = 'type MessengerNotification = {'
          if 'type MessengerRealtimePayload' not in s:
              insert_after = '''type MessengerNotification = {\n  conversationId?: string;\n  senderId?: string;\n  messageId?: string;\n  message?: string;\n  createdAt?: string;\n};'''
              replacement = insert_after + '''\ntype MessengerRealtimePayload = MessengerNotification & { conversation?: Conversation; messageRecord?: Message };'''
              if insert_after not in s: raise SystemExit('floating type block not found')
              s = s.replace(insert_after, replacement, 1)
          old = '''  useEffect(() => {\n    const handleNotification = (eventPayload: unknown) => {\n      const payload = getMessengerNotificationPayload(eventPayload);\n      if (!payload) return;\n      if (!open) setUnread((count) => count + 1);\n      if (open) void loadConversations(true);\n      if (open && payload.conversationId === selectedId) void loadMessages(selectedId, true);\n    };'''
          new = '''  useEffect(() => {\n    const handleNotification = (eventPayload: unknown) => {\n      const payload = getMessengerNotificationPayload(eventPayload) as MessengerRealtimePayload | null;\n      if (!payload) return;\n      if (!open) setUnread((count) => count + 1);\n      if (payload.conversation) {\n        setConversations((current) => [payload.conversation!, ...current.filter((item) => item.id !== payload.conversation!.id)]\n          .sort((a, b) => new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime()));\n      }\n      if (payload.messageRecord && payload.conversationId === selectedId) {\n        setMessages((current) => current.some((item) => item.id === payload.messageRecord!.id) ? current : [...current, payload.messageRecord!]);\n      }\n    };'''
          if old not in s: raise SystemExit('floating handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Verify no socket-triggered Messenger REST sync remains
        shell: bash
        run: |
          ! grep -n -A12 'socket.on("notifications.created"' apps/web/src/components/messenger/inbox-list.tsx | grep -E 'loadConversations|loadMessages'
          ! grep -n -A12 'socket.on("notifications.created"' apps/web/src/components/messenger/floating-messenger.tsx | grep -E 'loadConversations|loadMessages'

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/messenger/messenger.service.ts apps/web/src/components/messenger/inbox-list.tsx apps/web/src/components/messenger/floating-messenger.tsx
          git commit -m "fix(messenger): push full records over websocket" || true
          rm -f .github/workflows/apply-messenger-payload-sync.yml .github/messenger-payload-sync.trigger
          git add -u .github/workflows/apply-messenger-payload-sync.yml .github/messenger-payload-sync.trigger
          git commit -m "chore: remove messenger payload patch workflow" || true
          git push origin HEAD:main
