name: Temporary Messenger realtime cleanup

on:
  push:
    paths:
      - "__temp_messenger_realtime_trigger.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Messenger polling
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/messenger/inbox-list.tsx")
          text = path.read_text(encoding="utf-8")
          replacements = [
            ('''  useEffect(() => {\n    const timer = window.setInterval(() => void loadConversations(true), 5000);\n    return () => window.clearInterval(timer);\n  }, []);\n\n''', ''''''),
            ('''  useEffect(() => {\n    if (!selectedId) return;\n    void loadMessages(selectedId);\n    const timer = window.setInterval(() => void loadMessages(selectedId, true), 3000);\n    return () => window.clearInterval(timer);\n  }, [selectedId]);\n\n''', '''  useEffect(() => {\n    if (!selectedId) return;\n    void loadMessages(selectedId);\n  }, [selectedId]);\n\n'''),
            ('''  // Polling above is a fallback; new Messenger messages already arrive over the shared\n  // socket (the webhook path calls NotificationsService.notify, which emits\n  // "notifications.created"), so react to that immediately instead of waiting for the\n  // next 3-5s poll tick.\n''', '''  // Messenger updates are event-driven over the shared Socket.IO connection. REST is\n  // used only for the initial/history load and when a realtime event arrives.\n''')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected block not found: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f __temp_messenger_realtime_trigger.txt .github/workflows/__temp_messenger_realtime_fix.yml
          git add apps/web/src/components/messenger/inbox-list.tsx __temp_messenger_realtime_trigger.txt .github/workflows/__temp_messenger_realtime_fix.yml
          git commit -m "fix(web): replace Messenger polling with websocket updates"
          git push origin HEAD:main
