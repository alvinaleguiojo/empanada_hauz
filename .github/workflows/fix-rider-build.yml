name: Fix rider app build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-rider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch nullable rider job usage
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/rider/rider-app-v4.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'disabled={busy||!NEXT[job.status]} onClick={()=>onAdvance(job)}'
          new = 'disabled={busy || !job || !NEXT[job.status]} onClick={() => { if (job) onAdvance(job); }}'
          if old not in text:
              print("No rider nullable-job patch needed")
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit rider build fix
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/components/rider/rider-app-v4.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/rider/rider-app-v4.tsx
          git commit -m "fix rider nullable job build error"
          git push
