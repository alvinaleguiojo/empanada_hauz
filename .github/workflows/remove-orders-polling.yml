name: Remove Orders polling

on:
  push:
    paths:
      - "__run_remove_orders_polling.txt"

permissions:
  contents: write

jobs:
  remove-polling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove OrdersBoard 3-second polling
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/orders/orders-board.tsx")
          text = path.read_text(encoding="utf-8")
          block = '''  useEffect(() => {
    const interval = window.setInterval(() => { if (!editMode) refreshOrders(selectedDateRef.current, searchRef.current).catch((err) => setError(err instanceof Error ? err.message : "Unable to refresh orders")); }, 3_000);
    return () => window.clearInterval(interval);
  }, [editMode, refreshOrders]);

'''
          if block not in text:
              raise SystemExit("OrdersBoard 3-second polling block not found")
          path.write_text(text.replace(block, "", 1), encoding="utf-8")
      - name: Verify and commit
        shell: bash
        run: |
          if grep -n "setInterval.*3_000\|3_000.*refreshOrders" apps/web/src/components/orders/orders-board.tsx; then
            echo "3-second OrdersBoard polling still exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f __run_remove_orders_polling.txt .github/workflows/remove-orders-polling.yml
          git add apps/web/src/components/orders/orders-board.tsx __run_remove_orders_polling.txt .github/workflows/remove-orders-polling.yml
          git commit -m "refactor(web): remove OrdersBoard polling"
          git push origin HEAD:main
