name: Fix customer create page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: stabilize customer create address and total'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch customer create page
        shell: python
        run: |
          from pathlib import Path

          client = Path('apps/web/src/app/customer/page-client.tsx')
          text = client.read_text()

          old_effect = '''  useEffect(() => {\n    if (form.deliveryMethod !== \"maxim\" || !form.address.trim()) {\n      setDeliveryQuote(null);\n      return;\n    }\n\n    let cancelled = false;\n    setQuotingDelivery(true);\n    const timeout = window.setTimeout(() => {\n      const params = new URLSearchParams({ address: form.address });\n      if (form.landmark.trim()) {\n        params.set(\"landmark\", form.landmark);\n      }\n      apiFetch<{ distanceKm: number | null; estimatedFare: number }>(`/orders/delivery-quote?${params.toString()}`)\n        .then((quote) => {\n          if (!cancelled) setDeliveryQuote(quote);\n        })\n        .catch(() => {\n          if (!cancelled) setDeliveryQuote(null);\n        })\n        .finally(() => {\n          if (!cancelled) setQuotingDelivery(false);\n        });\n    }, 600);\n\n    return () => {\n      cancelled = true;\n      window.clearTimeout(timeout);\n      setQuotingDelivery(false);\n    };\n  }, [form.deliveryMethod, form.address, form.landmark]);'''

          new_effect = '''  useEffect(() => {\n    const address = form.address.trim();\n\n    // Keep address typing responsive. Only request a quote for Delivery, after\n    // the user pauses, and only once the address has enough detail to geocode.\n    if (form.deliveryMethod !== \"maxim\" || address.length < 8) {\n      setDeliveryQuote(null);\n      setQuotingDelivery(false);\n      return;\n    }\n\n    let cancelled = false;\n    const timeout = window.setTimeout(() => {\n      setQuotingDelivery(true);\n      const params = new URLSearchParams({ address });\n      if (form.landmark.trim()) {\n        params.set(\"landmark\", form.landmark.trim());\n      }\n\n      apiFetch<{ distanceKm: number | null; estimatedFare: number }>(`/orders/delivery-quote?${params.toString()}`)\n        .then((quote) => {\n          if (!cancelled) {\n            setDeliveryQuote(quote);\n          }\n        })\n        .catch(() => {\n          if (!cancelled) {\n            setDeliveryQuote(null);\n          }\n        })\n        .finally(() => {\n          if (!cancelled) {\n            setQuotingDelivery(false);\n          }\n        });\n    }, 800);\n\n    return () => {\n      cancelled = true;\n      window.clearTimeout(timeout);\n    };\n  }, [form.deliveryMethod, form.address, form.landmark]);'''

          if old_effect not in text:
              raise SystemExit('Customer delivery quote effect not found')
          text = text.replace(old_effect, new_effect, 1)

          old_summary = '''    const totalQuantity = items.reduce((sum, item) => sum + item.quantity, 0);\n    const subtotal = items.reduce((sum, item) => sum + item.subtotal, 0);\n\n    return { items, totalQuantity, subtotal };\n  }, [selectedFlavors]);'''
          new_summary = '''    const totalQuantity = items.reduce((sum, item) => sum + item.quantity, 0);\n    const subtotal = items.reduce((sum, item) => sum + item.subtotal, 0);\n\n    return { items, totalQuantity, subtotal };\n  }, [selectedFlavors]);'''
          if old_summary not in text:
              raise SystemExit('Customer summary block not found')
          text = text.replace(old_summary, new_summary, 1)

          text = text.replace('Php {summary.subtotal}', 'Php {summary.subtotal}', 2)

          client.write_text(text)

          page = Path('apps/web/src/app/customer/page.tsx')
          page.write_text('''"use client";\n\nexport { default } from "./page-client";\n''')

      - name: Apply customer total directly in React
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/app/customer/page-client.tsx')
          text = path.read_text()

          old_subtotal = '    const subtotal = items.reduce((sum, item) => sum + item.subtotal, 0);\n\n    return { items, totalQuantity, subtotal };'
          new_subtotal = '    const subtotal = items.reduce((sum, item) => sum + item.subtotal, 0);\n    const deliveryFee = form.deliveryMethod === "maxim" ? deliveryQuote?.estimatedFare ?? 0 : 0;\n    const total = subtotal + deliveryFee;\n\n    return { items, totalQuantity, subtotal, deliveryFee, total };'
          if old_subtotal not in text:
              raise SystemExit('Subtotal block not found')
          text = text.replace(old_subtotal, new_subtotal, 1)

          text = text.replace('  }, [selectedFlavors]);', '  }, [selectedFlavors, deliveryQuote, form.deliveryMethod]);', 1)
          text = text.replace('>Php {summary.subtotal}</span>', '>Php {summary.total}</span>')
          text = text.replace('Delivery fee is separate and confirmed by our team.', 'Total includes the estimated delivery fee; final fee is confirmed by our team.')
          path.write_text(text)

      - name: Verify
        run: |
          test -f apps/web/src/app/customer/page-client.tsx
          grep -n "const total = subtotal + deliveryFee" apps/web/src/app/customer/page-client.tsx
          grep -n "Php {summary.total}" apps/web/src/app/customer/page-client.tsx
          grep -n "export { default } from \"./page-client\"" apps/web/src/app/customer/page.tsx

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/customer/page-client.tsx apps/web/src/app/customer/page.tsx
          git rm .github/workflows/fix-customer-create-page.yml
          git commit -m "fix: stabilize customer create address and total"
          git push
