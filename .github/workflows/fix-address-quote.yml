name: Patch public sold-out menu

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(customer): show sold-out products in public menu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch customer menu
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/app/customer/page-client.tsx')
          text = path.read_text()

          replacements = [
            (
              '''  const allFlavorsSelected = selectedFlavors.length === flavorOptions.length;\n''',
              '''  const availableFlavors = flavorOptions.filter((option) => option.available !== false);\n  const allFlavorsSelected = selectedFlavors.length === availableFlavors.length;\n'''
            ),
            (
              '''  const toggleFlavor = (value: string) => {\n    setSelectedFlavors((current) => {\n      const existing = current.find((item) => item.value === value);\n      return existing ? current.filter((item) => item.value !== value) : [...current, { value, quantity: "1" }];\n    });\n  };\n''',
              '''  const toggleFlavor = (value: string) => {\n    const option = flavorOptions.find((item) => item.value === value);\n    if (!option || option.available === false) return;\n\n    setSelectedFlavors((current) => {\n      const existing = current.find((item) => item.value === value);\n      return existing ? current.filter((item) => item.value !== value) : [...current, { value, quantity: "1" }];\n    });\n  };\n'''
            ),
            (
              '''  const toggleAllFlavors = () => {\n    setSelectedFlavors((current) => current.length === flavorOptions.length\n      ? []\n      : flavorOptions.map((option) => current.find((item) => item.value === option.value) ?? { value: option.value, quantity: "1" }));\n  };\n''',
              '''  const toggleAllFlavors = () => {\n    setSelectedFlavors((current) => current.length === availableFlavors.length\n      ? []\n      : availableFlavors.map((option) => current.find((item) => item.value === option.value) ?? { value: option.value, quantity: "1" }));\n  };\n'''
            ),
            (
              '''                <div className="grid gap-3 sm:grid-cols-2">{flavorOptions.map((option) => { const selected = selectedFlavors.find((item) => item.value === option.value); return <div key={option.value} className={`relative rounded-xl border-2 p-4 transition ${selected ? "border-[#E3A64B] bg-[#E3A64B]/12" : "border-[#3a2c1c] bg-[#241c13]"}`}>\n''',
              '''                <div className="grid gap-3 sm:grid-cols-2">{flavorOptions.map((option) => { const selected = selectedFlavors.find((item) => item.value === option.value); const soldOut = option.available === false; return <div key={option.value} className={`relative rounded-xl border-2 p-4 transition ${soldOut ? "border-[#3a2c1c] bg-[#1a140d] opacity-65" : selected ? "border-[#E3A64B] bg-[#E3A64B]/12" : "border-[#3a2c1c] bg-[#241c13]"}`}>\n'''
            ),
            (
              '''                  <button type="button" onClick={() => toggleFlavor(option.value)} className="w-full text-left"><div className="flex items-start justify-between gap-3"><div><div className="font-[family-name:var(--font-display)] text-base text-[#F6EFDD]">{option.label}</div><div className="mt-1 font-[family-name:var(--font-mono)] text-sm text-[#E3A64B]">Php {option.price}</div></div>{selected ? <span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-[#E3A64B] text-[#1a140d]"><CheckCircle2 size={15} /></span> : <span className="h-6 w-6 shrink-0 rounded-full border-2 border-dashed border-[#F2E8D5]/25" />}</div></button>\n''',
              '''                  <button type="button" onClick={() => toggleFlavor(option.value)} disabled={soldOut} aria-disabled={soldOut} className={`w-full text-left ${soldOut ? "cursor-not-allowed" : ""}`}><div className="flex items-start justify-between gap-3"><div><div className={`font-[family-name:var(--font-display)] text-base ${soldOut ? "text-[#F2E8D5]/55" : "text-[#F6EFDD]"}`}>{option.label}</div><div className={`mt-1 font-[family-name:var(--font-mono)] text-sm ${soldOut ? "text-[#F2E8D5]/40 line-through" : "text-[#E3A64B]"}`}>Php {option.price}</div></div>{soldOut ? <span className="rounded-full border border-[#C0472B]/40 bg-[#C0472B]/10 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-[#C0472B]">Sold out</span> : selected ? <span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-[#E3A64B] text-[#1a140d]"><CheckCircle2 size={15} /></span> : <span className="h-6 w-6 shrink-0 rounded-full border-2 border-dashed border-[#F2E8D5]/25" />}</div></button>\n'''
            ),
            (
              '''                  {selected ? <label className="mt-3 block"''',
              '''                  {selected && !soldOut ? <label className="mt-3 block"'''
            )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected customer menu source was not found:\n{old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify patch
        run: |
          grep -n "const availableFlavors" apps/web/src/app/customer/page-client.tsx
          grep -n "Sold out" apps/web/src/app/customer/page-client.tsx
          grep -n "disabled={soldOut}" apps/web/src/app/customer/page-client.tsx

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/customer/page-client.tsx
          git rm .github/workflows/fix-address-quote.yml
          git commit -m "fix(customer): show sold-out products in public menu"
          git push
