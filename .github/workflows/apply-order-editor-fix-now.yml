name: Apply order editor fix now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/components/orders/orders-board.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {
    if (
      !selectedOrder ||
      productOptions.length === 0
    ) {
      return;
    }

    setLineItems((current) => {
      const hasAllCatalogProducts =
        productOptions.every((product) =>
          current.some(
            (item) =>
              item.productName.toLowerCase() ===
              product.value.toLowerCase(),
          ),
        );

      return hasAllCatalogProducts
        ? current
        : createEditableLineItems(
            selectedOrder,
            productOptions,
          );
    });
  }, [productOptions, selectedOrder?.id]);'''
          new = '''  useEffect(() => {
    if (
      !selectedOrder ||
      productOptions.length === 0
    ) {
      return;
    }

    setLineItems((current) => {
      if (current.length > 0) {
        return current;
      }

      return createEditableLineItems(
        selectedOrder,
        productOptions,
      );
    });
  }, [productOptions, selectedOrder?.id]);'''
          if old not in text:
              raise SystemExit('target order editor effect not found; refusing to modify file')
          path.write_text(text.replace(old, new, 1))
      - name: Verify and clean up
        shell: bash
        run: |
          grep -n -A18 -B2 'setLineItems((current)' apps/web/src/components/orders/orders-board.tsx
          git rm .github/workflows/apply-order-editor-fix-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/orders/orders-board.tsx
          git commit -m "fix: preserve edited order line items when catalog loads"
          git push origin HEAD:main
