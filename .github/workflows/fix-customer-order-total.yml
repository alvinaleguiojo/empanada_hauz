name: Fix customer order total

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: include delivery fee in customer order total'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch customer order total
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/app/customer/page.tsx')
          text = path.read_text()

          old_summary = '''    const totalQuantity = items.reduce((sum, item) => sum + item.quantity, 0);\n    const subtotal = items.reduce((sum, item) => sum + item.subtotal, 0);\n\n    return { items, totalQuantity, subtotal };'''
          new_summary = '''    const totalQuantity = items.reduce((sum, item) => sum + item.quantity, 0);\n    const subtotal = items.reduce((sum, item) => sum + item.subtotal, 0);\n    const deliveryFee = form.deliveryMethod === \"maxim\" ? deliveryQuote?.estimatedFare ?? 0 : 0;\n    const total = subtotal + deliveryFee;\n\n    return { items, totalQuantity, subtotal, deliveryFee, total };'''

          old_dependency = '  }, [selectedFlavors]);'
          new_dependency = '  }, [selectedFlavors, form.deliveryMethod, deliveryQuote]);'

          old_total = '                  <span className="font-[family-name:var(--font-mono)] text-xl font-bold text-[#C0472B]">Php {summary.subtotal}</span>'
          new_total = '                  <span className="font-[family-name:var(--font-mono)] text-xl font-bold text-[#C0472B]">Php {summary.total}</span>'

          old_note = '''                {form.deliveryMethod === "maxim" ? (\n                  <p className="mt-1.5 text-center text-[11px] text-[#241c13]/45">\n                    Delivery fee is separate and confirmed by our team.\n                  </p>\n                ) : null}'''
          new_note = '''                {form.deliveryMethod === "maxim" ? (\n                  <p className="mt-1.5 text-center text-[11px] text-[#241c13]/45">\n                    Total includes the estimated delivery fee; final fee is confirmed by our team.\n                  </p>\n                ) : null}'''

          old_sticky = '              Php {summary.subtotal}'
          new_sticky = '              Php {summary.total}'

          replacements = [
              (old_summary, new_summary),
              (old_dependency, new_dependency),
              (old_total, new_total),
              (old_note, new_note),
              (old_sticky, new_sticky),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source text not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify patch
        run: |
          grep -n "const deliveryFee = form.deliveryMethod" apps/web/src/app/customer/page.tsx
          grep -n "Php {summary.total}" apps/web/src/app/customer/page.tsx

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/customer/page.tsx
          git rm .github/workflows/fix-customer-order-total.yml
          git commit -m "fix: include delivery fee in customer order total"
          git push
