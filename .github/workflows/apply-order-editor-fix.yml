name: Apply order editor fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch order editor state initialization
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/components/orders/orders-board.tsx")
          text = path.read_text()

          old = '''  useEffect(() => {
    if (
      !selectedOrder ||
      productOptions.length === 0
    ) {
      return;
    }

    setLineItems((current) => {
      const hasAllCatalogProducts =
        productOptions.every((product) =>
          current.some(
            (item) =>
              item.productName.toLowerCase() ===
              product.value.toLowerCase(),
          ),
        );

      return hasAllCatalogProducts
        ? current
        : createEditableLineItems(
            selectedOrder,
            productOptions,
          );
    });
  }, [productOptions, selectedOrder?.id]);
'''

          new = '''  useEffect(() => {
    if (
      !selectedOrder ||
      productOptions.length === 0
    ) {
      return;
    }

    setLineItems((current) => {
      if (current.length > 0) {
        return current;
      }

      return createEditableLineItems(
        selectedOrder,
        productOptions,
      );
    });
  }, [productOptions, selectedOrder?.id]);
'''

          if old not in text:
              raise SystemExit("Expected order editor effect was not found")

          path.write_text(text.replace(old, new, 1))

      - name: Commit fix and remove temporary runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/orders/orders-board.tsx .github/workflows/apply-order-editor-fix.yml
          git commit -m "fix: preserve edited order line items when catalog loads"
          git push origin HEAD:main
