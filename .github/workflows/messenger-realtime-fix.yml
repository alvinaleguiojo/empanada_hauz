name: Messenger realtime cleanup
on:
  push:
    paths:
      - "__messenger_realtime_trigger.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Messenger polling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/components/messenger/inbox-list.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''  useEffect(() => {\n    const timer = window.setInterval(() => void loadConversations(true), 5000);\n    return () => window.clearInterval(timer);\n  }, []);\n\n'''
          if old not in text:
              raise SystemExit("conversation polling block not found")
          text = text.replace(old, "", 1)
          old = '''  useEffect(() => {\n    if (!selectedId) return;\n    void loadMessages(selectedId);\n    const timer = window.setInterval(() => void loadMessages(selectedId, true), 3000);\n    return () => window.clearInterval(timer);\n  }, [selectedId]);\n\n'''
          new = '''  useEffect(() => {\n    if (!selectedId) return;\n    void loadMessages(selectedId);\n  }, [selectedId]);\n\n'''
          if old not in text:
              raise SystemExit("message polling block not found")
          text = text.replace(old, new, 1)
          old = '''  // Polling above is a fallback; new Messenger messages already arrive over the shared\n  // socket (the webhook path calls NotificationsService.notify, which emits\n  // "notifications.created"), so react to that immediately instead of waiting for the\n  // next 3-5s poll tick.\n'''
          new = '''  // Messenger updates are event-driven over the shared Socket.IO connection. REST is\n  // used only for the initial/history load and when a realtime event arrives.\n'''
          if old not in text:
              raise SystemExit("polling comment block not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f __messenger_realtime_trigger.txt .github/workflows/messenger-realtime-fix.yml .github/workflows/__temp_messenger_realtime_fix.yml
          git add apps/web/src/components/messenger/inbox-list.tsx __messenger_realtime_trigger.txt .github/workflows/messenger-realtime-fix.yml .github/workflows/__temp_messenger_realtime_fix.yml
          git commit -m "fix(web): replace Messenger polling with websocket updates"
          git push origin HEAD:main
