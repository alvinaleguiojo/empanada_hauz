name: Messenger realtime fix

on:
  push:
    paths:
      - "__run_messenger_realtime_fix.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Messenger polling
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/messenger/inbox-list.tsx")
          text = path.read_text(encoding="utf-8")
          conversation_poll = '''  useEffect(() => {\n    const timer = window.setInterval(() => void loadConversations(true), 5000);\n    return () => window.clearInterval(timer);\n  }, []);\n\n'''
          message_poll = '''  useEffect(() => {\n    if (!selectedId) return;\n    void loadMessages(selectedId);\n    const timer = window.setInterval(() => void loadMessages(selectedId, true), 3000);\n    return () => window.clearInterval(timer);\n  }, [selectedId]);\n\n'''
          if conversation_poll not in text:
              raise SystemExit("conversation polling block not found")
          if message_poll not in text:
              raise SystemExit("message polling block not found")
          text = text.replace(conversation_poll, "", 1)
          text = text.replace(message_poll, '''  useEffect(() => {\n    if (!selectedId) return;\n    void loadMessages(selectedId);\n  }, [selectedId]);\n\n''', 1)
          old_comment = '''  // Polling above is a fallback; new Messenger messages already arrive over the shared\n  // socket (the webhook path calls NotificationsService.notify, which emits\n  // "notifications.created"), so react to that immediately instead of waiting for the\n  // next 3-5s poll tick.\n'''
          new_comment = '''  // Messenger updates are event-driven over the shared Socket.IO connection. REST is\n  // used only for the initial/history load and when a realtime event arrives.\n'''
          if old_comment not in text:
              raise SystemExit("polling comment not found")
          text = text.replace(old_comment, new_comment, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit fix and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f __run_messenger_realtime_fix.txt .github/workflows/messenger-realtime-fix.yml
          git add apps/web/src/components/messenger/inbox-list.tsx __run_messenger_realtime_fix.txt .github/workflows/messenger-realtime-fix.yml
          git commit -m "fix(web): remove Messenger polling and use websocket"
          git push origin HEAD:main
