name: Finalize customer address input fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: customer address quote on blur'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer page to quote on blur only
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/app/customer/page-client.tsx')
          text = path.read_text()

          start_marker = '  // Estimate the delivery fee once the customer has entered an address'
          end_marker = '  // If the delivery date is today'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''  const quoteDelivery = () => {
    if (form.deliveryMethod !== "maxim" || !form.address.trim()) {
      setDeliveryQuote(null);
      setQuotingDelivery(false);
      return;
    }

    setQuotingDelivery(true);
    const params = new URLSearchParams({ address: form.address.trim() });
    if (form.landmark.trim()) {
      params.set("landmark", form.landmark.trim());
    }

    apiFetch<{ distanceKm: number | null; estimatedFare: number }>(`/orders/delivery-quote?${params.toString()}`)
      .then((quote) => setDeliveryQuote(quote))
      .catch(() => setDeliveryQuote(null))
      .finally(() => setQuotingDelivery(false));
  };

'''
          text = text[:start] + replacement + text[end:]

          old_address = '''                      onChange={(event) => handleChange("address", event.target.value)}
                      className="w-full rounded-lg border-2 border-[#3a2c1c] bg-[#241c13] px-4 py-3 text-[#F6EFDD] outline-none placeholder:text-[#F2E8D5]/35"'''
          new_address = '''                      onChange={(event) => handleChange("address", event.target.value)}
                      onBlur={quoteDelivery}
                      className="w-full rounded-lg border-2 border-[#3a2c1c] bg-[#241c13] px-4 py-3 text-[#F6EFDD] outline-none placeholder:text-[#F2E8D5]/35"'''
          if old_address not in text:
              raise SystemExit('Customer address input not found')
          text = text.replace(old_address, new_address, 1)

          old_landmark = '''                      onChange={(event) => handleChange("landmark", event.target.value)}
                      className="w-full rounded-lg border-2 border-[#3a2c1c] bg-[#241c13] px-4 py-3 text-[#F6EFDD] outline-none placeholder:text-[#F2E8D5]/35"'''
          new_landmark = '''                      onChange={(event) => handleChange("landmark", event.target.value)}
                      onBlur={quoteDelivery}
                      className="w-full rounded-lg border-2 border-[#3a2c1c] bg-[#241c13] px-4 py-3 text-[#F6EFDD] outline-none placeholder:text-[#F2E8D5]/35"'''
          if old_landmark not in text:
              raise SystemExit('Customer landmark input not found')
          text = text.replace(old_landmark, new_landmark, 1)

          path.write_text(text)

          page = Path('apps/web/src/app/customer/page.tsx')
          page.write_text('''"use client";

import CustomerKioskPage from "./page-client";

export default function CustomerPage() {
  return <CustomerKioskPage />;
}
''')

      - name: Verify
        run: |
          grep -n "const quoteDelivery" apps/web/src/app/customer/page-client.tsx
          grep -n 'onBlur={quoteDelivery}' apps/web/src/app/customer/page-client.tsx
          grep -n 'return <CustomerKioskPage />' apps/web/src/app/customer/page.tsx

      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/customer/page-client.tsx apps/web/src/app/customer/page.tsx
          git rm .github/workflows/fix-customer-address-blur.yml
          git commit -m "fix: customer address quote on blur"
          git push
